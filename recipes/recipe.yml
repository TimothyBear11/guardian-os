# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: guardian-os
description: Guardian OS 
base-image: ghcr.io/blue-build/base-images/fedora-cosmic
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      nonfree: negativo17
      files:
        - https://negativo17.org/repos/fedora-steam.repo
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      copr:
        - ublue-os/packages
        - sneexy/floorp
        - bieszczaders/kernel-cachyos-addons
        - lionheartp/Hyprland
          
    install:
      install-weak-deps: false
      packages:
        - sbsigntools
        # Terra Repos
        - terra-release
        - terra-release-mesa
        - terra-release-multimedia
        # Steam (32-bit core execution support)
        - steam
        - steam-devices
        - glibc.i686
        - mesa-vulkan-drivers.i686
        - vulkan-loader.i686
        # Performance & Sched-ext
        - scx-scheds
        - scx-tools
        # Bluebuild & UBlue Utilities
        - uupd
        - ublue-os-just
        - ublue-os-udev-rules
        - ublue-os-media-automount-udev
        # Desktop Environments & Portals
        - hyprland
        - hyprland-guiutils
        - niri
        - noctalia
        - xdg-desktop-portal
        - xdg-desktop-portal-gtk
        - xdg-desktop-portal-hyprland
        - xdg-desktop-portal-gnome
        # System Essentials
        - fish
        - neovim
        - emacs-nox
        - fastfetch
        - btop
        - plymouth-plugin-script
        - helix
        - gamescope
        - mangohud
        - ripgrep
        - fd
        - git
        - jq
        - socat
        - sqlite
        - playerctl
        - libnotify
        - network-manager-applet
        - distrobox
        - mpv
        - pciutils
        - kitty
        - gamemode
        - fftw
        - qt6ct
        - qt6-qtdeclarative
        - qt6-qtwayland
        - qt6-qt5compat
        - qt6-qtsvg
        - qt6-qtmultimedia
        - tmux
        - pipx
        - cpio
        - pkg-config
        - python3-pip
        - brightnessctl
        - grim
        - slurp
        - ark
        - wget
        - floorp
        - bat
        - cargo
        - eza
        - cava
        - fuzzel
        - fzf
        - gh
        - kde-connect
        - nwg-look
        - protonplus
        - zed
        - nodejs
        - ffmpeg
        
    remove:
      auto-remove: true
      packages:
        - firefox
        - firefox-langpacks
        - gnome-system-monitor
        - toolbox
        - google-noto-color-emoji-fonts
        - gnome-disk-utility
        - waybar
        - yelp
        - fedora-chromium-config-kde
        - fedora-chromium-config
        - fedora-bookmarks
        - mako
        # Accessibility
        - brltty
        - orca
        - speech-dispatcher
        # Virtualization
        - open-vm-tools
        - qemu-guest-agent
        - hyperv-daemons
        - spice-vdagent
        - khelpcenter
        # Modem services
        - ModemManager
        - qcom-wwan-firmware
        - espeak-ng
        - braille-printer-app

  - type: script
    snippets:
      - |
        set -euo pipefail
        # Configure native scx-scheds default scheduler
        mkdir -p /etc/default
        echo "SCX_SCHEDULER=scx_bpfland" > /etc/default/scx

  - type: brew

  # Assets Mapping
  - type: files
    files:
      - source: system-fonts
        destination: /usr/share/fonts/guardian-fonts
      - source: etc/plymouth
        destination: /etc/plymouth
      - source: usr/share/plymouth/themes/guardian
        destination: /usr/share/plymouth/themes/guardian

  - type: fonts
    fonts:
      url-fonts:
        - name: NotoColorEmoji
          url: https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf
      nerd-fonts:
        - FiraCode
        - JetBrainsMono
        - NerdFontsSymbolsOnly
      google-fonts:
        - Acme
        - Exo 2
        - Orbitron

  - type: default-flatpaks
    configurations:
      - scope: user
        repo:
          title: Flathub (user)
      - notify: false
        scope: system
        repo:
          title: Flathub (system)

  # System Clean-up & Plymouth Setup
  - type: script
    snippets:
      - "plymouth-set-default-theme guardian"
      - |
        if [ -f /etc/rpm-ostreed.conf ]; then
          sed -i 's/AutomaticUpdatePolicy=stage/AutomaticUpdatePolicy=none/g' /etc/rpm-ostreed.conf
        fi

  - type: systemd
    system:
      enabled:
        - uupd.timer
        - scx.service
      disabled:
        - dnf-makecache.timer

  - type: os-release
    properties:
      NAME: Guardian OS
      PRETTY_NAME: Guardian OS (Atomic)

  - type: signing
  - type: initramfs
