# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: guardian-os
description: Guardian OS 
base-image: ghcr.io/blue-build/base-images/fedora-cosmic
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /
  - type: dnf
    install:
      packages:
        - sbsigntools

  - type: dnf
    repos:
      nonfree: negativo17
      files:
        - https://negativo17.org/repos/fedora-steam.repo
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      copr:
        - ublue-os/packages
        - sneexy/floorp
        - bieszczaders/kernel-cachyos-addons
        - lionheartp/Hyprland
        - derisis13/ani-cli
       
   
    install:
      install-weak-deps: false
      packages:
        # Terra Repos
        - terra-release
        - terra-release-mesa
        - terra-release-multimedia
        # Steam
        - steam
        - steam-devices
        - libva.i686
        - mesa-dri-drivers.i686
        - mesa-vulkan-drivers.i686
        - vulkan-loader.i686
        - glibc.i686
        - ibus-gtk2.i686
        - libgcc.i686
        - libstdc++.i686
        # Performance
        - scx-scheds
        - scx-tools
        # Bluebuild
        - uupd
        - ublue-os-just
        - ublue-os-udev-rules
        - ublue-os-media-automount-udev
        # DEs
        - hyprland
        - hyprland-guiutils
        - niri
        - noctalia
        # Den Essentials
        - fish
        - neovim
        - emacs-nox
        - fastfetch
        - btop
        - plymouth-plugin-script
        - helix
        - gamescope
        - mangohud
        - ripgrep
        - fd-find
        - git
        - jq
        - socat
        - sqlite
        - playerctl
        - libnotify
        - network-manager-applet
        - distrobox
        - mpv
        - pciutils
        - kitty
        - gamemode
        - fftw
        - qt6ct
        - qt6-qtdeclarative
        - qt6-qtwayland
        - qt6-qt5compat
        - qt6-qtsvg
        - qt6-qtmultimedia
        - tmux
        - pipx
        - cpio
        - pkg-config
        - yt-dlp
        - python3-pip
        - brightnessctl
        - grim
        - slurp
        - ark
        - wget
        - floorp
        - ani-cli
        - bat
        - cargo
        - eza
        - cava
        - fd
        - fuzzel
        - fzf
        - gh
        - kde-connect
        - neovim
        - nwg-look
        - protonplus
        - zed
        - nodejs
        - ffmpeg
        
    remove:
      auto-remove: true
      packages:
        - firefox
        - firefox-langpacks
        - gnome-system-monitor
        - toolbox
        - google-noto-color-emoji-fonts
        - gnome-disk-utility
        - waybar
        - yelp
        - fedora-chromium-config-kde
        - fedora-chromium-config
        - fedora-bookmarks
        - mako
        # Accessibility (The "Speech" Bloat)
        - brltty
        - orca
        - speech-dispatcher
        # Virtualization (Bare Metal don't need these)
        - open-vm-tools
        - qemu-guest-agent
        - hyperv-daemons
        - spice-vdagent
        - khelpcenter
        # Modem services
        - ModemManager
        - qcom-wwan-firmware
        - espeak-ng
        - braille-printer-app

  - type: script
    snippets:
      - |
        set -euo pipefail
        cat << 'EOF' > /etc/systemd/system/scx_bpfland.service
        [Unit]
        Description=Sched-ext Bpfland Scheduler
        After=multi-user.target
        [Service]
        Type=simple
        ExecStart=/usr/bin/scx_bpfland
        Restart=always
        RestartSec=10s
        [Install]
        WantedBy=multi-user.target
        EOF
        systemctl enable scx_bpfland.service

  - type: brew

  # STEP: Assets Mapping (Fonts & Plymouth)
  - type: files
    files:
      - source: system-fonts
        destination: /usr/share/fonts/guardian-fonts
      - source: etc/plymouth
        destination: /etc/plymouth
      - source: usr/share/plymouth/themes/guardian
        destination: /usr/share/plymouth/themes/guardian

  - type: fonts
    fonts:
      url-fonts:
        - name: NotoColorEmoji
          url: https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf
      nerd-fonts:
        - FiraCode
        - JetBrainsMono
        - NerdFontsSymbolsOnly
      google-fonts:
        - Acme # Moved here for better management
        - Exo 2 # Great for a technical brand aesthetic
        - Orbitron # Matches a sharp, "guardian" look

  - type: default-flatpaks
    configurations:
      - scope: user
        repo:
          # you can override the title to make inclusion of both system and user repos clearer
          title: Flathub (user)
      - notify: false
        scope: system
        repo:
          title: Flathub (system)

  # STEP: System Clean-up (Notification Daemon Conflict Resolution)
  - type: script
    snippets:
      - "plymouth-set-default-theme guardian"
      - |
        if [ -f /etc/rpm-ostreed.conf ]; then
          sed -i 's/AutomaticUpdatePolicy=stage/AutomaticUpdatePolicy=none/g' /etc/rpm-ostreed.conf
        fi

  - type: systemd
    system:
      enabled:
        - uupd.timer # Keep the system updated
      disabled:
        - dnf-makecache.timer # We use uupd, so we don't need dnf's background noise

  # STEP 4: Branding
  - type: os-release
    properties:
      NAME: Guardian OS
      PRETTY_NAME: Guardian OS (Atomic)

  - type: signing
  - type: initramfs
